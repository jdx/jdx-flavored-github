name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: aube install --frozen-lockfile
      - name: Run tests
        run: aube run test

  pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            style
            test
            perf
            build
            ci
            revert
            security

  final:
    name: Final
    needs:
      - test
      - pull-request-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    if: ${{ !cancelled() }}
    steps:
      - name: Gate on upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          # The title check only applies to pull requests, so a skip on push or
          # manual runs is expected. Every other upstream job must succeed.
          skip_ok = {"pull-request-title"}

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = False
          for name, data in sorted(needs.items()):
              result = data.get("result", "unknown")
              if result == "success":
                  print(f"::notice::{name}: {result}")
              elif result == "skipped" and name in skip_ok:
                  print(f"::notice::{name}: {result} (allowed to skip)")
              else:
                  print(f"::error::{name}: {result}")
                  failed = True

          if failed:
              print("One or more upstream jobs did not complete successfully.")
              sys.exit(1)

          print("All CI jobs completed successfully.")
          PY
