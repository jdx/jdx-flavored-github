name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to package and publish
        required: false
        type: string
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      package-ready: ${{ steps.target.outputs.ready }}
      tag-name: ${{ steps.target.outputs.tag_name }}
    steps:
      - name: Open or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out release pull request
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Install tools for release formatting
        if: steps.release.outputs.prs_created == 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
      - name: Install dependencies for release formatting
        if: steps.release.outputs.prs_created == 'true'
        run: aube install --frozen-lockfile
      - name: Format release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$RELEASE_PLEASE_TOKEN"; }; f'
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          aube run format
          if git diff --quiet; then
            echo "Release pull request is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          git commit -m "chore: format release files"
          git push origin "HEAD:${RELEASE_BRANCH}"
      - name: Resolve release to package
        id: target
        env:
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag_name="$CREATED_TAG"
          if [ -z "$tag_name" ]; then
            tag_name="$REQUESTED_TAG"
          fi
          if [ -z "$tag_name" ]; then
            tag_name="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq 'map(select(.draft and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))) | sort_by(.created_at) | last | .tag_name // empty')"
          fi
          if [ -n "$tag_name" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package extension
    needs: release-please
    if: needs.release-please.outputs.package-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      archive-name: ${{ steps.archive.outputs.name }}
    permissions:
      contents: write
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag-name }}
      - name: Install tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_save: false
      - name: Install dependencies
        run: aube install --frozen-lockfile
      - name: Test extension
        run: aube run test
      - name: Build Chrome extension archive
        id: archive
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: |
          archive="jdx-flavored-github-${TAG_NAME}.zip"
          (cd dist && zip -r "../${archive}" .)
          echo "name=${archive}" >> "$GITHUB_OUTPUT"
      - name: Retain workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-extension-${{ needs.release-please.outputs.tag-name }}
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error
      - name: Attach archive to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: gh release upload "$TAG_NAME" "$ARCHIVE" --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: gh release edit "$TAG_NAME" --draft=false

  chrome-web-store:
    name: Submit Chrome Web Store update
    needs:
      - release-please
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download extension archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-extension-${{ needs.release-please.outputs.tag-name }}
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload extension package
        id: upload
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ARCHIVE: ${{ needs.package.outputs.archive-name }}
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          resource="publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}"
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --request POST \
            --data-binary "@${ARCHIVE}" \
            "https://chromewebstore.googleapis.com/upload/v2/${resource}:upload")"
          state="$(jq --raw-output '.uploadState' <<< "$response")"
          polls_remaining=30
          while [ "$state" = "IN_PROGRESS" ] && [ "$polls_remaining" -gt 0 ]; do
            sleep 10
            response="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              "https://chromewebstore.googleapis.com/v2/${resource}:fetchStatus")"
            state="$(jq --raw-output '.lastAsyncUploadState' <<< "$response")"
            polls_remaining=$((polls_remaining - 1))
          done
          if [ "$state" = "SUCCEEDED" ]; then
            echo "Chrome Web Store accepted the package."
            exit 0
          fi
          if [ "$state" != "IN_PROGRESS" ]; then
            echo "Unexpected Chrome Web Store upload state: ${state}" >&2
            jq . <<< "$response" >&2
            exit 1
          fi
          echo "Chrome Web Store upload did not finish within five minutes." >&2
          exit 1
      - name: Submit extension for review
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          resource="publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}"
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{"publishType":"DEFAULT_PUBLISH","blockOnWarnings":true}' \
            "https://chromewebstore.googleapis.com/v2/${resource}:publish")"
          state="$(jq --raw-output '.state' <<< "$response")"
          if [ "$state" != "PENDING_REVIEW" ] && [ "$state" != "PUBLISHED" ]; then
            echo "Unexpected Chrome Web Store submission state: ${state}" >&2
            jq . <<< "$response" >&2
            exit 1
          fi
          echo "Chrome Web Store submission state: ${state}"
